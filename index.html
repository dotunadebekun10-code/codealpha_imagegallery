<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A premium responsive image gallery with filtering and lightbox.">
    <title>Premium Image Gallery</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Creative Gallery</h1>
        <p>Explore our premium collection of generated imagery</p>
    </header>

    <main>
        <!-- Filter Buttons -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
            <button class="filter-btn" data-filter="technology">Technology</button>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery" id="gallery">
            <div class="gallery-item" data-category="nature">
                <img src="images/nature_1_1784197561711.png" alt="Mountain Landscape">
                <div class="overlay">
                    <span class="category">Nature</span>
                </div>
            </div>
            <div class="gallery-item" data-category="nature">
                <img src="images/nature_2_1784197569730.png" alt="Misty Forest">
                <div class="overlay">
                    <span class="category">Nature</span>
                </div>
            </div>
            <div class="gallery-item" data-category="architecture">
                <img src="images/architecture_1_1784197578977.png" alt="Modern Skyscraper">
                <div class="overlay">
                    <span class="category">Architecture</span>
                </div>
            </div>
            <div class="gallery-item" data-category="architecture">
                <img src="images/architecture_2_1784197587244.png" alt="European Street">
                <div class="overlay">
                    <span class="category">Architecture</span>
                </div>
            </div>
            <div class="gallery-item" data-category="technology">
                <img src="images/technology_1_1784197595795.png" alt="Circuit Board">
                <div class="overlay">
                    <span class="category">Technology</span>
                </div>
            </div>
            <div class="gallery-item" data-category="technology">
                <img src="images/technology_2_1784197604146.png" alt="Robotic Arm">
                <div class="overlay">
                    <span class="category">Technology</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" id="close-btn">&times;</button>
        <div class="lightbox-content">
            <button class="nav-btn prev-btn" id="prev-btn">&#10094;</button>
            <img src="" alt="Lightbox Image" id="lightbox-img">
            <button class="nav-btn next-btn" id="next-btn">&#10095;</button>
        </div>
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
